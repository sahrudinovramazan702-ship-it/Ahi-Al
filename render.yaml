services:
  - type: web
    name: ahi-ai-telegram-bot
    runtime: python
    plan: free
    rootDir: telegram-bot
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: AI_MODEL
        value: openrouter/free
